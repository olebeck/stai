name: CMake Build and Release

on:
  push:
    branches:
      - master
    tags:
      v*

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake xz-utils libarchive-tools
    
      - name: Vitasdk
        run: |
          git clone https://github.com/vitasdk/vdpm
          cd vdpm
          ./bootstrap-vitasdk.sh
          export VITASDK=/usr/local/vitasdk
          export PATH=$PATH:$VITASDK/bin
          echo "VITASDK=/usr/local/vitasdk" >> $GITHUB_ENV
          echo "PATH=${PATH}:/usr/local/vitasdk/bin" >> $GITHUB_ENV
          vdpm pacman -S taihen --noconfirm

      - name: Determine release tag
        id: set_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "release_tag=prerelease-${short_sha}" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: |
          cmake -Bbuild -S . -DCMAKE_BUILD_TYPE=Release -DSTAI_VERSION=${{ steps.set_tag.outputs.release_tag }}
          cmake --build build --config Release --target all

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set_tag.outputs.release_tag }}
          name: ${{ steps.set_tag.outputs.release_tag }}
          body: |
            Build from ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
          files: |
            build/stai-*.pkg.tar.xz
            build/stai.skprx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
